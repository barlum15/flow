<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>flow</title>
    <script>
      // Apply the saved theme before the first paint to avoid a flash.
      try {
        const theme = localStorage.getItem("flow-theme");
        if (theme === "light" || theme === "dark") document.documentElement.dataset.theme = theme;
      } catch {}
    </script>
    <link rel="stylesheet" href="src/style.css" />
  </head>
  <body>
    <header>
      <h1>flow</h1>
      <div class="controls">
        <span id="day" class="pill">Day 1</span>
        <span id="clock" class="clock">06:00</span>
        <button id="play" type="button">Pause</button>
        <label>
          Speed
          <select id="speed">
            <option value="1">1 min/s</option>
            <option value="10" selected>10 min/s</option>
            <option value="60">1 h/s</option>
          </select>
        </label>
        <button id="theme-switch" class="theme-switch" type="button" role="switch" aria-checked="false" aria-label="Dark mode">
          <span class="knob"></span>
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
            <circle cx="12" cy="12" r="4" />
            <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
          </svg>
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" />
          </svg>
        </button>
      </div>
    </header>

    <main>
      <section class="panel house-panel">
        <svg id="house" role="img" aria-label="Devices in the house connected to the smart meter"></svg>
        <div id="devices" class="device-list" aria-label="Switch devices on or off"></div>
      </section>

      <section class="panel meter-panel">
        <div class="meter-header">
          <h2>Smart meter</h2>
          <span id="live-badge" class="live-badge"><span class="live-dot"></span>Live</span>
        </div>

        <div class="readout">
          <div class="readout-main">
            <span class="stat-label">Current power</span>
            <span class="big-value"><span id="total">0</span><span class="unit">W</span></span>
          </div>
          <div class="readout-grid">
            <div>
              <span class="stat-label">Today</span>
              <span class="stat-value"><span id="energy">0.00</span><span class="unit">kWh</span></span>
            </div>
            <div>
              <span class="stat-label">Peak today</span>
              <span class="stat-value"><span id="peak">0</span><span class="unit">W</span></span>
            </div>
            <div>
              <span class="stat-label">Meter reading</span>
              <span class="stat-value counter"><span id="reading">00000.000</span><span class="unit">kWh</span></span>
            </div>
          </div>
        </div>

        <div class="chart-block">
          <div class="chart-header">
            <div class="segmented" role="tablist" aria-label="Chart range">
              <button type="button" role="tab" data-range="live" aria-selected="true">Live</button>
              <button type="button" role="tab" data-range="day" aria-selected="false">Today</button>
            </div>
            <span id="chart-hint" class="chart-hint">last 60 min · 1-minute resolution</span>
          </div>
          <div class="chart-wrap">
            <canvas id="chart" class="chart" aria-label="Total power recorded by the smart meter"></canvas>
          </div>
        </div>
      </section>
    </main>

    <p id="error" class="error"></p>
    <script type="module" src="src/main.js"></script>
  </body>
</html>
